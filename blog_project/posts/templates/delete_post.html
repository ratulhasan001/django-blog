{% extends 'base.html' %}
{% block title %}Delete {{ post.title }}{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 540px">
  <h1 class="h3">Delete post</h1>
  <p>Are you sure you want to delete "{{ post.title }}"? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'post_detail' post.id %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
